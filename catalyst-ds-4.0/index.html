<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Certa Studio — Vendor risk & procurement (DS 4.0)</title>
  <meta name="viewport" content="width=1280" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App-shell CSS (ported DS 3.0 → DS 4.0 tokens); @imports ../../colors_and_type.css -->
  <link rel="stylesheet" href="ui_kits/certa-studio/styles.css" />

  <style>
    .ck-gallery-link {
      position: fixed; right: 16px; bottom: 16px; z-index: 1500;
      display: inline-flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 14px; border-radius: var(--radius-full);
      background: var(--color-bg-page); border: 1px solid var(--color-border-default);
      box-shadow: var(--shadow-md); color: var(--color-text-secondary);
      font: 600 13px/1 var(--font-family-base); text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="ck-gallery-link" href="gallery.html">◧ Component gallery</a>

  <!-- React 18 + Babel standalone (in-browser JSX transform) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- Certa Studio app — global-scope (window) modules, loaded in dependency order -->
  <script type="text/babel" src="ui_kits/certa-studio/Icons.jsx"></script>
  <!-- Canonical DS 4.0 kit (generated from Primitives.jsx + components/ by build_kit.py) -->
  <script type="text/babel" src="ui_kits/certa-studio/kit.global.jsx"></script>
  <script type="text/babel" src="ui_kits/certa-studio/AppShell.jsx"></script>
  <script type="text/babel" src="ui_kits/certa-studio/HomeDashboard.jsx"></script>
  <script type="text/babel" src="ui_kits/certa-studio/VendorsList.jsx"></script>
  <script type="text/babel" src="ui_kits/certa-studio/VendorDetail.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <noscript>This demo requires JavaScript enabled.</noscript>
</body>
</html>
