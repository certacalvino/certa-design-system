<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certa Studio — DS 4.0 Catalyst</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- DS 4.0 semantic token layer -->
  <link rel="stylesheet" href="colors_and_type.css">

  <!-- React 18 + Babel standalone (in-browser JSX transform) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--color-bg-subtle); }
    /* gallery link pill */
    .gallery-link {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 16px; border-radius: 9999px;
      background: var(--color-bg-page); border: 1px solid var(--color-border-default);
      box-shadow: var(--shadow-md); color: var(--color-text-secondary);
      font: 600 14px/1 var(--font-family-base); text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="gallery-link" href="gallery.html">◧ Component gallery</a>

  <!-- Certa Studio click-through app (composes DS 4.0 components) -->
  <script type="text/babel" src="app.jsx" data-presets="react"></script>

  <noscript>This demo requires JavaScript enabled.</noscript>
</body>
</html>
